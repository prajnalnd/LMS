<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRAJNA LMS: Demo</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#2a1a0c;--mut:#7a6650;--line:#e8dccb;--acc:#c8590a;--on:#fff;--soft:#fdf0e1;--ok:#2d7a3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120d;--card:#211a13;--ink:#f3eadf;--mut:#b3a392;--line:#3a2e22;--acc:#f08a3c;--on:#1a0f05;--soft:#2e2217;--ok:#6cc47f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17120d;--card:#211a13;--ink:#f3eadf;--mut:#b3a392;--line:#3a2e22;--acc:#f08a3c;--on:#1a0f05;--soft:#2e2217;--ok:#6cc47f;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;font-weight:700;letter-spacing:2px;font-size:17px}
.om{width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center;font-size:18px}
.srch{flex:1;max-width:420px;border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:7px 16px;color:var(--ink)}
.sp{flex:1}
.chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.av{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-weight:700}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:stretch;background:var(--soft);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:34px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.hp{position:relative;min-height:350px}
.hp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:38% 20%}
.hp::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 62%,var(--soft) 100%)}
.hp::before{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--acc);z-index:1}
.hb{padding:36px 36px 36px 6px;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:clamp(24px,3.2vw,38px);line-height:1.18;margin:6px 0 10px}
.hero p{color:var(--mut);max-width:520px}
.hero .cta{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.hero .cta .btn{margin-top:0;padding:10px 22px}
.trk{margin-bottom:30px}.trk .grid{margin-bottom:0}
.eb{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--acc);margin-bottom:12px;display:flex;align-items:center;gap:12px}
.eb::after{content:"";flex:1;height:1px;background:var(--line)}
.stats{display:flex;gap:28px;margin-top:18px;flex-wrap:wrap}
.stats b{display:block;font-size:22px;color:var(--acc)}
.stats span{font-size:12px;color:var(--mut)}
h2{font-size:20px;margin:6px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;margin-bottom:30px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;transition:transform .15s,box-shadow .15s}
.mc:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.12)}
.mt{height:104px;display:grid;place-items:center;color:#fff;font-size:34px;position:relative}
.bd{position:absolute;top:8px;right:8px;font-size:11px;padding:2px 9px;border-radius:12px;background:rgba(0,0,0,.45)}
.mb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.mb strong{font-size:15px}.mb small{color:var(--mut);font-size:12.5px}
.btn{margin-top:auto;border:0;border-radius:8px;padding:8px 14px;font-weight:600;background:var(--acc);color:var(--on)}
.btn.o{background:none;border:1px solid var(--acc);color:var(--acc)}
.btn.g{background:var(--line);color:var(--mut);cursor:default}
.crumb{font-size:13px;color:var(--mut);margin-bottom:14px}
.crumb a{color:var(--acc);cursor:pointer}
.ban{border-radius:16px;padding:28px 30px;color:#fff;margin-bottom:22px}
.ban h1{font-size:28px}.ban p{opacity:.9}
.pb{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--acc)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s}
.tile:hover:not(.lock){border-color:var(--acc);transform:translateY(-3px)}
.tile.lock{opacity:.55;cursor:not-allowed}
.tile .ic{font-size:38px}.tile h3{font-size:22px}.tile p{color:var(--mut)}
.lay{display:grid;grid-template-columns:310px 1fr;gap:20px;align-items:start}
.tree{background:var(--card);border:1px solid var(--line);border-radius:12px;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));max-height:calc(100vh - 90px);overflow:auto}
.th{padding:14px 16px;border-bottom:1px solid var(--line)}
.th b{display:block;margin-bottom:8px}
.th small{color:var(--mut);font-size:12px}
details{border-bottom:1px solid var(--line)}
summary{padding:10px 16px;cursor:pointer;font-weight:600;font-size:13.5px;display:flex;justify-content:space-between;list-style:none}
summary::before{content:"▸";margin-right:8px;color:var(--acc)}
details[open] summary::before{content:"▾"}
summary span{margin-left:auto;color:var(--mut);font-weight:400;font-size:12px}
.it{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:8px 16px 8px 30px;font-size:13.5px;border-left:3px solid transparent}
.it:hover{background:var(--soft)}
.it.on{background:var(--soft);border-left-color:var(--acc);font-weight:600}
.dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);font-size:11px;display:grid;place-items:center;flex-shrink:0;color:var(--mut)}
.dot.d{background:var(--ok);border-color:var(--ok);color:#fff}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.hd h1{font-size:26px;line-height:1.25}
.tag{font-size:12px;color:var(--acc);letter-spacing:1px;text-transform:uppercase;font-weight:600}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.sec h3{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-bottom:12px;display:flex;gap:8px;align-items:center}
.sec p{margin-bottom:10px;line-height:1.75}
.sec p:last-child{margin-bottom:0}
.aud{display:flex;align-items:center;gap:14px;background:var(--soft);border-radius:12px;padding:14px 16px}
.pl{width:46px;height:46px;border-radius:50%;border:0;background:var(--acc);color:var(--on);font-size:18px;flex-shrink:0}
.aud .bar{flex:1}
.aud .tm{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.vid{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#2a1405;display:grid;place-items:center;color:#fff}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vp{width:74px;height:74px;border-radius:50%;border:0;background:var(--acc);color:var(--on);font-size:28px}
.vc{position:absolute;left:16px;bottom:12px;font-size:13px;opacity:.85}
.cap{font-size:12.5px;color:var(--mut);margin-top:10px}.cap a{color:var(--acc)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.note{background:var(--soft);border:1px dashed var(--acc);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--mut);margin-bottom:18px}
.mt .lg{max-width:78%;max-height:72px}
.tile .cv{width:100%;max-width:230px;border-radius:8px;border:1px solid var(--line);align-self:center}
.q{margin-bottom:18px}.qq{font-weight:600;margin-bottom:8px}
.qo{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 12px;margin-bottom:6px}
.qo:hover{border-color:var(--acc)}.qo.s{border-color:var(--acc);background:var(--soft)}
.qo.ok{border-color:var(--ok);background:rgba(45,122,62,.14)}.qo.no{border-color:#c0392b;background:rgba(192,57,43,.14)}
.score{padding:12px 14px;border-radius:10px;background:var(--soft);font-weight:600;margin-bottom:12px}
@media (max-width:820px){.lay{grid-template-columns:1fr}.tree{position:static;max-height:340px}.srch{display:none}}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hp{min-height:240px}.hp::after{background:linear-gradient(180deg,transparent 60%,var(--soft) 100%)}.hb{padding:8px 24px 28px}}
.adb{margin-top:0;padding:6px 14px;font-size:13px;white-space:nowrap}
.aud .pb{cursor:pointer;height:8px}
.spd{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-size:12px;min-width:46px}
.aud.off{opacity:.55}.aud.off .pl{cursor:not-allowed}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:30;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.ah{font-size:28px;margin-bottom:12px}.ah2{font-size:22px;line-height:1.25}
.atools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 24px}.atools .btn{margin-top:0}
.atable{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.arow{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}.arow:last-child{border-bottom:0}
.arow .btn{margin-top:0}.an{font-weight:600;flex:1 1 200px}.am{color:var(--mut);font-size:13px;flex:1 1 160px}.pub{font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer}
.tabs{display:flex;gap:6px;margin:8px 0 10px}
.tb{flex:1;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;font-size:13px}.tb.on{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
.in{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px 12px;font:inherit}
.in:focus{outline:2px solid var(--acc);outline-offset:-1px}
textarea.in{resize:vertical;line-height:1.6}
.hint{font-size:12.5px;color:var(--mut);margin-top:8px}
.arow2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}.arow2 .btn{margin-top:0}
.arow2 .sp{flex:1}
.filebtn{display:inline-block;cursor:pointer;text-align:center}
.btn.dng{background:none;border:1px solid #c0392b;color:#c0392b}.btn.dng:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled{cursor:not-allowed}
.btn.sm{padding:5px 12px;font-size:13px}
.sv{font-size:13px;color:var(--ok)}
.abar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.abar .btn{margin-top:0}
.astat{font-size:14px}
.qe{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--bg)}
.qh{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}.qh .sp{flex:1}
.qh button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:2px 9px}
.qh button.dng{color:#c0392b;border-color:#c0392b}
.opt{display:flex;gap:8px;align-items:center;margin-top:8px}.opt input[type=radio]{accent-color:var(--acc);width:18px;height:18px;flex-shrink:0}
.opt .x{border:1px solid var(--line);background:var(--card);border-radius:6px;width:32px;height:36px;flex-shrink:0}.opt .x:disabled{opacity:.35;cursor:not-allowed}
.warn{font-size:12px;color:#c0392b}
.in.sm{width:auto;padding:6px 10px}.in.num{width:90px;margin-left:6px}
.alist .it{padding-left:16px}.alist .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th .btn{margin-top:4px}
@media (max-width:600px){.top{gap:8px;padding:10px 12px}.chip #subn{display:none}.adb{padding:6px 10px}.wrap{padding-left:14px;padding-right:14px}}
/* ===== PRAJNA navy + gold theme ===== */
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#071433;--card:#0f2252;--ink:#f7efdb;--mut:#aebbdc;--line:rgba(232,184,74,.25);--acc:#e8b84a;--on:#2a1a00;--soft:rgba(232,184,74,.11);--ok:#62d28c;--gold:#f6d27a;color-scheme:dark}
body{background:radial-gradient(900px 500px at 85% -5%,rgba(58,90,200,.35),transparent),radial-gradient(800px 500px at 0 25%,rgba(106,60,170,.25),transparent),#071433;background-attachment:fixed;position:relative;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(1.4px 1.4px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#ffe9a8,transparent),radial-gradient(1.6px 1.6px at 160px 60px,#fff,transparent),radial-gradient(1px 1px at 210px 190px,#fff,transparent),radial-gradient(1.2px 1.2px at 50px 200px,#ffe9a8,transparent);background-size:240px 240px}
.top,.wrap{position:relative;z-index:1}.top{position:sticky}
h1,h2,.hero2 h1,.ah,.ah2,.hd h1{font-family:Georgia,"Times New Roman",serif;letter-spacing:.3px}
h2{font-size:24px;background:linear-gradient(90deg,#f6d27a,#e8b84a);-webkit-background-clip:text;background-clip:text;color:transparent;margin:10px 0 16px}
.top{background:rgba(6,16,44,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top[hidden]{display:none}
.srch{background:rgba(255,255,255,.07);border-color:var(--line);color:var(--ink);width:100%}.srch::placeholder{color:var(--mut)}
.sw{position:relative;flex:1;max-width:420px}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#0b1b46;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.5);overflow:hidden;z-index:20}
.sres[hidden]{display:none}
.sr{display:flex;flex-direction:column;width:100%;text-align:left;background:none;border:0;padding:9px 14px;font-size:14px;border-bottom:1px solid var(--line)}
.sr:hover{background:var(--soft)}.sr small{color:var(--mut);font-size:12px}.sr.none{color:var(--mut)}
.pill{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;white-space:nowrap}
.pill b{color:var(--gold)}
.av{background:linear-gradient(135deg,#f6d27a,#d9a02e);color:var(--on)}
.chip{color:var(--ink)}
.btn{background:linear-gradient(180deg,#f8d98a,#dba331);color:var(--on);border-radius:999px;padding:9px 18px;box-shadow:0 4px 14px rgba(232,184,74,.3);transition:transform .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(232,184,74,.5)}
.btn.o{background:transparent;color:var(--gold);border:1px solid var(--acc);box-shadow:none}
.btn.o:hover:not(:disabled){background:var(--soft)}
.btn.g{background:rgba(255,255,255,.1);color:var(--mut);box-shadow:none}
.btn.big{padding:12px 26px;font-size:16px}
.btn.dng{color:#ff8f82;border-color:#ff8f82}
.btn:focus-visible,.it:focus-visible,.qo:focus-visible,.tile:focus-visible,.in:focus-visible{outline:3px solid #fff;outline-offset:2px}
.crumb a{color:var(--gold)}
.pb{background:rgba(255,255,255,.12)}.pb i{background:linear-gradient(90deg,#f6d27a,#e8b84a)}
/* cards */
.mc,.tile,.sec,.tree,.atable,.hc{background:linear-gradient(160deg,rgba(26,52,118,.82),rgba(12,28,72,.92));border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.mc:hover{transform:translateY(-5px);box-shadow:0 14px 34px rgba(232,184,74,.22);border-color:var(--acc)}
.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.mt2{height:130px;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 25% 15%,hsl(var(--h) 45% 36%),hsl(var(--h) 55% 14%) 80%)}
.mt2 .lg{position:relative;max-width:68%;max-height:82px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.mo{position:absolute;right:-6px;bottom:-14px;font-size:84px;opacity:.28;transform:rotate(-12deg);pointer-events:none}
.bd{background:rgba(5,12,36,.7);border:1px solid var(--line);color:var(--gold)}
.mb strong{font-family:Georgia,serif;font-size:16px}
.mb .pb{margin:6px 0}
/* hero */
.hero2{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--acc);box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 0 4px rgba(232,184,74,.08);margin-bottom:26px;min-height:380px;background:#0a1c58}
.hbg{position:absolute;inset:0;width:100%;height:100%}
.hin{position:relative;display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;padding:34px 38px}
.gph{text-align:center}
.gph img{width:230px;height:230px;object-fit:cover;object-position:40% 18%;border-radius:50%;border:5px solid var(--acc);box-shadow:0 0 0 8px rgba(232,184,74,.15),0 0 50px rgba(246,210,122,.55);animation:float 5s ease-in-out infinite}
.cap2{display:inline-block;margin-top:14px;background:rgba(5,12,36,.75);border:1px solid var(--acc);color:var(--gold);padding:4px 14px;border-radius:999px;font-size:13px;font-family:Georgia,serif}
.hero2 h1{font-size:clamp(26px,3.6vw,42px);line-height:1.15;margin:6px 0 10px;background:linear-gradient(90deg,#fff3cf,#f6d27a 60%,#e8b84a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero2 p{color:#d6def5;max-width:560px}
.hero2 .cta{margin-top:16px}
.hero2 .stats b{color:var(--gold)}.hero2 .stats span{color:#c9d4f0}
.stats{gap:26px}
.xp{margin:14px 0 4px;max-width:460px}.xpt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:10px}.xpt b{color:var(--gold)}.xpt span{color:var(--mut)}.xp .pb{height:10px}
.tag{color:var(--gold)}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-bottom:28px}
.hc{border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:6px}
.hc .btn{margin-top:auto;align-self:flex-start}.hl{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);font-weight:700}
.hc h3{font-family:Georgia,serif;font-size:19px}.hc p{color:var(--mut)}
.qt{font-family:Georgia,serif;font-size:19px;color:var(--ink)!important;font-style:italic;line-height:1.5}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;opacity:.5;filter:grayscale(.6)}.bdg.on{opacity:1;filter:none}
.bdg i{font-style:normal;font-size:26px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line)}.bdg.on i{background:radial-gradient(circle,#ffe9a8,#e8b84a);box-shadow:0 0 16px rgba(246,210,122,.6)}
.bdg small{font-size:11px;line-height:1.2}
.how{margin-bottom:30px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.steps>div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:18px 12px;border-radius:16px;background:var(--soft);border:1px dashed var(--line)}
.steps i{font-style:normal;font-size:34px}.steps b{font-family:Georgia,serif;color:var(--gold)}.steps span{font-size:13px;color:var(--mut)}
.eb{color:var(--gold)}
/* module page */
.ban{position:relative;overflow:hidden;display:flex;align-items:center;gap:22px;flex-wrap:wrap;border:1px solid var(--acc);color:#fff;background:radial-gradient(circle at 15% 20%,hsl(var(--h) 45% 34%),hsl(var(--h) 55% 13%) 75%);box-shadow:0 14px 40px rgba(0,0,0,.4)}
.ban .bl{height:72px;position:relative;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}.ban>div{position:relative}.ban .tag{color:var(--gold)}

.lhero h1{font-size:clamp(32px,4.6vw,56px);line-height:1.08;margin:8px 0 12px;background:linear-gradient(90deg,#fff3cf,#f6d27a 55%,#e8b84a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}

.perks{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}.perks span{background:rgba(5,12,36,.65);border:1px solid var(--line);color:var(--gold);padding:5px 14px;border-radius:999px;font-size:14px}
.lcard{background:rgba(7,18,52,.82);backdrop-filter:blur(12px);border:1px solid var(--acc);border-radius:24px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 40px rgba(232,184,74,.18);display:flex;flex-direction:column;gap:8px}

  for(var n=1;n<=13;n++){var live=n<=4,pr=[],st=[];

function idb(){return DBP||(DBP=new Promise(function(res,rej){var r=indexedDB.open('prajna-audio',1);r.onupgradeneeded=function(){r.result.createObjectStore('audio')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}))}
function tx(mode,fn){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction('audio',mode),rq=fn(t.objectStore('audio'));t.oncomplete=function(){res(rq&&rq.result)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})})}
function aput(k,b){return tx('readwrite',function(s){return s.put(b,k)})}
function aget(k){return tx('readonly',function(s){return s.get(k)})}
function adel(k){revoke(k);return tx('readwrite',function(s){return s.delete(k)}).catch(function(){})}
function aclear(){Object.keys(AU).forEach(revoke);return tx('readwrite',function(s){return s.clear()}).catch(function(){})}
function revoke(k){if(AU[k]){URL.revokeObjectURL(AU[k]);delete AU[k]}}
function audioUrl(s){if(!s)return Promise.resolve(null);if(s.t==='url')return Promise.resolve(s.url);if(AU[s.key])return Promise.resolve(AU[s.key]);
  return aget(s.key).then(function(b){if(!b)return null;return AU[s.key]=URL.createObjectURL(b)}).catch(function(){return null})}

function vidSec(l){var id=ytId(l.video),h='<div class="sec"><h3>🎬 Animation video</h3>';
  if(!id)return h+'<div class="cap" style="margin-top:0">The video has not been added yet.</div></div>';
  return h+'<div class="vid" id="vid" style="background:#2a1405 url(https://i.ytimg.com/vi/'+id+'/hqdefault.jpg) center/cover"><button class="vp" onclick="vplay()" aria-label="Play video">▶</button><span class="vc">'+esc(l.title)+' · Animation</span></div><div class="cap">Videos are hosted on YouTube. <a href="https://youtu.be/'+id+'" target="_blank" rel="noopener">Open on YouTube</a></div></div>'}
function vq(l){return(l.quiz||[]).filter(function(q){return q.q.trim()&&q.o.length>=2&&q.o.every(function(o){return o.trim()})})}
function passMark(l,n){var p=parseInt(l.pass,10);return Math.min(n,Math.max(1,p>0?p:Math.ceil(n*0.8)))}
function qzs(){var l=curLesson();if(!QZ||QZ.id!==l.id)QZ={id:l.id,a:{},sub:false};return QZ}
function quizSec(l){var w=S.kind==='prayers'?'prayer':'story';
  if(!vq(l).length)return'<div class="sec"><h3>📝 Quiz</h3><p>A quiz for this '+w+' has not been added yet.</p></div>';
  return'<div class="sec"><h3>📝 Quick quiz</h3><div id="qz">'+quizBody()+'</div></div>'}
function quizBody(){var l=curLesson(),qs=vq(l),z=qzs(),w=S.kind==='prayers'?'prayer':'story',h='';
  qs.forEach(function(q,i){h+='<div class="q"><div class="qq">'+(i+1)+'. '+esc(q.q)+'</div>';
    q.o.forEach(function(o,j){var c='qo';if(z.sub){if(j===q.a)c+=' ok';else if(z.a[i]===j)c+=' no'}else if(z.a[i]===j)c+=' s';
      h+='<button class="'+c+'" onclick="qpick('+i+','+j+')">'+String.fromCharCode(65+j)+'. '+esc(o)+'</button>'});h+='</div>'});
  var n=Object.keys(z.a).length,pm=passMark(l,qs.length);
  if(z.sub){var sc=0;qs.forEach(function(q,i){if(z.a[i]===q.a)sc++});
    if(sc>=pm){var nx=curList()[S.idx+1];
      h+='<div class="score" style="background:rgba(45,122,62,.14);border:1px solid var(--ok)">🎉 Congratulations! You scored '+sc+' of '+qs.length+'. You have completed this '+w+'.</div>'+(nx?'<p style="margin-bottom:10px">Ready for the next one? Continue to <b>'+esc(nx.title)+'</b>.</p><button class="btn" onclick="pick(S.idx+1)">Go to next '+w+' →</button> ':'<p style="margin-bottom:10px">That was the last one in this list. Well done!</p>')+'<button class="btn o" onclick="qreset()">Retake quiz</button>'}
    else h+='<div class="score">You scored '+sc+' of '+qs.length+'. Review the lesson text above and try again. You need at least '+pm+' correct.</div><button class="btn" onclick="qreset()">Try again</button>'}
  else h+='<button class="btn" onclick="qsub()"'+(n<qs.length?' disabled style="opacity:.5"':'')+'>Submit answers</button> <small style="color:var(--mut)">'+n+' of '+qs.length+' answered</small>';
  return h}
function qpick(i,j){var z=qzs();if(z.sub)return;z.a[i]=j;document.getElementById('qz').innerHTML=quizBody()}
function qsub(){var l=curLesson(),qs=vq(l),z=qzs(),sc=0;z.sub=true;qs.forEach(function(q,i){if(z.a[i]===q.a)sc++});

/* learner audio players */
function boxOf(el){return el.closest('.aud')}
function aplay(btn){var a=boxOf(btn).querySelector('audio');
  if(a.paused){document.querySelectorAll('audio').forEach(function(x){if(x!==a)x.pause()});var p=a.play();if(p&&p.catch)p.catch(function(){})}else a.pause()}
function aseek(e,pb){var a=boxOf(pb).querySelector('audio');if(!a.duration)return;a.currentTime=Math.max(0,Math.min(1,(e.clientX-pb.getBoundingClientRect().left)/pb.offsetWidth))*a.duration}
var SPEEDS=[1,1.25,1.5,0.75];
function aspd(btn){var a=boxOf(btn).querySelector('audio'),i=(SPEEDS.indexOf(a.playbackRate)+1)%SPEEDS.length;a.playbackRate=SPEEDS[i];btn.textContent=SPEEDS[i]+'×'}
function hydrate(){var l=S.view==='learn'&&curList().length?curLesson():null;if(!l)return;
  document.querySelectorAll('.aud:not(.off)').forEach(function(box){
    var a=box.querySelector('audio'),btn=box.querySelector('.pl'),bar=box.querySelector('.pb i'),ct=box.querySelector('.ct'),dt=box.querySelector('.dt');
    function bad(m){box.classList.add('off');btn.disabled=true;box.querySelector('.spd').disabled=true;if(!box.parentNode.querySelector('.cap'))box.insertAdjacentHTML('afterend','<div class="cap">'+m+'</div>')}
    audioUrl(l[box.dataset.slot]).then(function(u){
      if(!u)return bad('The uploaded file was not found in this browser. Re-upload it in Admin.');
      a.onloadedmetadata=function(){dt.textContent=fmt(a.duration)};
      a.ontimeupdate=function(){ct.textContent=fmt(a.currentTime);bar.style.width=a.duration?a.currentTime/a.duration*100+'%':'0%'};
      a.onplay=function(){btn.textContent='⏸'};a.onpause=function(){btn.textContent='▶'};
      a.onended=function(){btn.textContent='▶';bar.style.width='0%';ct.textContent='0:00'};
      a.onerror=function(){bad('This audio could not be loaded. Check the file or link in Admin.')};
      a.preload='metadata';a.src=u})})}

  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='prajna-quiz-template.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},3000)}
function parseCSV(t){t=t.replace(/^﻿/,'');var first=t.split(/\r?\n/)[0]||'',d=',',best=-1;[',',';','\t'].forEach(function(c){var n=first.split(c).length;if(n>best){best=n;d=c}});
  var rows=[],r=[],f='',q=false,i,ch;
  for(i=0;i<t.length;i++){ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===d){r.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';rows.push(r);r=[]}
    else f+=ch}
  if(f!==''||r.length){r.push(f);rows.push(r)}
  return rows.filter(function(r){return r.some(function(c){return c.trim()})})}
function qimp(inp){var f=inp.files[0];inp.value='';if(!f)return;var mode=document.getElementById('qmode').value,rd=new FileReader();
  rd.onerror=function(){toast('Could not read that file')};
  rd.onload=function(){var rows=parseCSV(String(rd.result)),bad=[],good=[];
    if(rows.length<2){QUS='No questions were found. Please use the template (the first row must be the header).';refreshEditor();return}
    var h=rows[0].map(function(c){return c.trim().toLowerCase()}),qc=-1,cc=-1,oc=[];
    h.forEach(function(c,i){if(qc<0&&/question/.test(c))qc=i;else if(/^(option|choice)\b|^[a-f]$/.test(c))oc.push(i);else if(cc<0&&/correct|answer/.test(c))cc=i});
    if(qc<0||oc.length<2||cc<0){QUS='The header row was not recognised. Please download the template and keep its first row as it is.';refreshEditor();return}
    rows.slice(1).forEach(function(r,ri){var n=ri+2,q=(r[qc]||'').trim(),opts=oc.map(function(i){return(r[i]||'').trim()}),ca=(r[cc]||'').trim(),idx=-1;
      if(!q){bad.push('Row '+n+': the question is empty');return}
      if(/^[a-f]$/i.test(ca))idx=ca.toLowerCase().charCodeAt(0)-97;else if(/^[1-9]$/.test(ca))idx=+ca-1;else idx=opts.findIndex(function(o){return o&&o.toLowerCase()===ca.toLowerCase()});
      if(idx<0||idx>=opts.length||!opts[idx]){bad.push('Row '+n+': the correct answer "'+ca+'" does not match a filled option');return}
      var keep=[],na=0;opts.forEach(function(o,i){if(o){if(i===idx)na=keep.length;keep.push(o)}});
      if(keep.length<2){bad.push('Row '+n+': needs at least two options');return}
      good.push({q:q,o:keep,a:na})});
    if(!good.length){QUS='No valid questions were loaded.\n'+bad.slice(0,6).join('\n');refreshEditor();return}
    var l=al();if(mode==='replace'&&l.quiz.length&&!confirm('Replace the '+l.quiz.length+' existing question(s) with '+good.length+' from the file?'))return;
    l.quiz=mode==='replace'?good:l.quiz.concat(good);save(true);
    QUS='✓ Loaded '+good.length+' question'+(good.length>1?'s':'')+' from '+f.name+'.'+(bad.length?'\n'+bad.length+' row(s) were skipped:\n'+bad.slice(0,6).join('\n')+(bad.length>6?'\n…':''):'');
    toast('Loaded '+good.length+' question'+(good.length>1?'s':''));refreshEditor()};
  rd.readAsText(f,'utf-8')}

window.addEventListener('hashchange',function(){var v=location.hash.slice(1);if(VIEWS.indexOf(v)>-1){S.view=v;render()}});
function render(keep){var y=window.scrollY;document.querySelectorAll('audio').forEach(function(a){a.pause()});
  if(!USER){if(S.view!=='signup')S.view='login'}else if(S.view==='login'||S.view==='signup')S.view='home';
  else if(['admin','adminc','regs'].indexOf(S.view)>-1&&USER.role!=='admin'){S.view='home';toast('The admin area is only for admins')}
  if(location.hash.slice(1)!==S.view)try{history.replaceState(null,'','#'+S.view)}catch(e){}
  var V={signup:signupView,regs:regsView,register:registerView,login:loginView,home:home,module:module_,learn:learn,admin:adminHome,adminc:adminCourse};
  document.getElementById('app').innerHTML=V[S.view]();hdr();
  if(S.view==='signup'&&!SU.done)suUpd();if(S.view==='learn')hydrate();if(S.view==='adminc')hydrateAdmin();
  window.scrollTo(0,keep?y:0)}
(function(){try{var u=sessionStorage.getItem(AKEY);if(u&&Object.prototype.hasOwnProperty.call(USERS,u))startSession(u)}catch(e){}
  var v=location.hash.slice(1);S.view=v==='learn'?'module':v==='adminc'?'admin':VIEWS.indexOf(v)>-1?v:'home';render()})();
</script>
</body>
</html>
